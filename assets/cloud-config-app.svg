<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8CCDF8"/>
      <stop offset="1" stop-color="#3F97E0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A78C2"/>
      <stop offset="1" stop-color="#1A5C9E"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EDEDED"/>
    </linearGradient>
    <linearGradient id="gear" gradientUnits="userSpaceOnUse" x1="0" y1="134" x2="0" y2="222">
      <stop offset="0" stop-color="#1F68B0"/>
      <stop offset="1" stop-color="#11457D"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tile" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base tile: Cloud Backup's (Yaru rounded square with bottom edge), in sky blue -->
  <g filter="url(#tile)">
    <rect x="20" y="24" width="216" height="212" rx="44" fill="url(#edge)"/>
    <rect x="20" y="20" width="216" height="208" rx="44" fill="url(#bg)"/>
    <rect x="21" y="21" width="214" height="206" rx="43" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- Cloud: Cloud Backup's shape, a little up and to the left -->
  <g transform="translate(34 38) scale(0.32)" filter="url(#soft)">
    <path fill="url(#cloud)" d="M115.2 435.2C51.6 435.2 0 383.6 0 320c0-50.24 32.16-92.96 76.96-108.72-.08-2.16-.16-4.32-.16-6.48 0-70.72 57.28-128 128-128 47.44 0 88.8 25.76 110.96 64.16A76.4 76.4 0 0 1 358.4 128c42.4 0 76.8 34.4 76.8 76.8 0 9.76-1.84 19.04-5.12 27.68C476.8 241.92 512 283.28 512 332.8c0 56.56-45.84 102.4-102.4 102.4z"/>
  </g>

  <!-- Gear in front, bottom right, coming out of the cloud: 8 teeth, outlined in white -->
  <path filter="url(#soft)" fill="url(#gear)" fill-rule="evenodd" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"
        d="M187.3 144.2 L196.8 135.9 L204.7 139.2 L205.6 151.7 L210.3 156.4 L222.8 157.3 L226.1 165.2 L217.8 174.7 L217.8 181.3 L226.1 190.8 L222.8 198.7 L210.3 199.6 L205.6 204.3 L204.7 216.8 L196.8 220.1 L187.3 211.8 L180.7 211.8 L171.2 220.1 L163.3 216.8 L162.4 204.3 L157.7 199.6 L145.2 198.7 L141.9 190.8 L150.2 181.3 L150.2 174.7 L141.9 165.2 L145.2 157.3 L157.7 156.4 L162.4 151.7 L163.3 139.2 L171.2 135.9 L180.7 144.2Z M198.0 178.0 A14 14 0 1 0 170.0 178.0 A14 14 0 1 0 198.0 178.0Z"/>
</svg>
