<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The Dock icon of the QEMU window on macOS (run-qemu.sh's try-ubuntu.app):
       assets/try-ubuntu.icns is this, rendered. A screen in a silver bezel, in the
       style of Ghostty's icon, with Ubuntu's colors; the glyph is a desktop screen
       (a top bar and a dock, on a stand) with the penguin in front of it. The
       penguin is traced from a PNG (potrace), so it stays sharp at every size. -->
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C001E"/><stop offset="0.5" stop-color="#77216F"/><stop offset="1" stop-color="#F6844F"/></linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFAFB"/><stop offset="0.5" stop-color="#D4D5DA"/><stop offset="1" stop-color="#9C9DA4"/>
    </linearGradient>
    <linearGradient id="bevel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8C8D94"/><stop offset="1" stop-color="#E9E9ED"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26262B"/><stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFB27A" stop-opacity="0.55"/><stop offset="1" stop-color="#FFB27A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="scan" width="8" height="6" patternUnits="userSpaceOnUse"><rect width="8" height="3" fill="#000000" opacity="0.13"/></pattern>
    <clipPath id="face"><rect x="184" y="184" width="656" height="656" rx="112"/></clipPath>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="inner" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="14"/></filter>
    <!-- the glyph, in the penguin's 1200-unit box: the mask keeps the screen
         clear of the penguin, with a gap around it -->
    <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="1300" height="1300">
      <rect width="1300" height="1300" fill="#FFFFFF"/>
      <path transform="translate(0 1200) scale(0.1 -0.1)" fill="#000000" stroke="#000000" stroke-width="900" stroke-linejoin="round" d="M8393 5724 c-893 -121 -1667 -684 -2084 -1515 -147 -293 -241 -605 -284 -944 -20 -151 -32 -1697 -17 -2127 11 -332 18 -357 145 -483 88 -89 151 -122 260 -138 120 -17 4580 -16 4686 1 124 21 244 104 322 224 74 116 71 40 67 1388 -3 1205 -3 1205 -30 1340 -122 608 -352 1045 -772 1466 -409 408 -849 646 -1411 759 -226 46 -655 60 -882 29z"/>
    </mask>
    <g id="glyph">
      <g mask="url(#behind)">
        <path fill-rule="evenodd" d="M285 90 H995 A85 85 0 0 1 1080 175 V585 A85 85 0 0 1 995 670 H285 A85 85 0 0 1 200 585 V175 A85 85 0 0 1 285 90 Z M304 164 H976 A30 30 0 0 1 1006 194 V566 A30 30 0 0 1 976 596 H304 A30 30 0 0 1 274 566 V194 A30 30 0 0 1 304 164 Z"/>
        <rect x="334" y="224" width="612" height="50" rx="25"/>
        <rect x="334" y="324" width="50" height="212" rx="25"/>
        <rect x="585" y="670" width="110" height="170"/>
        <rect x="350" y="840" width="580" height="74" rx="37"/>
      </g>
      <path transform="translate(0 1200) scale(0.1 -0.1)" d="M8393 5724 c-893 -121 -1667 -684 -2084 -1515 -147 -293 -241 -605 -284 -944 -20 -151 -32 -1697 -17 -2127 11 -332 18 -357 145 -483 88 -89 151 -122 260 -138 120 -17 4580 -16 4686 1 124 21 244 104 322 224 74 116 71 40 67 1388 -3 1205 -3 1205 -30 1340 -122 608 -352 1045 -772 1466 -409 408 -849 646 -1411 759 -226 46 -655 60 -882 29z m-531 -1489 c339 -71 595 -441 639 -924 13 -138 1 -369 -24 -480 l-12 -55 -178 -37 c-104 -21 -177 -32 -177 -26 0 5 7 46 16 90 48 234 -15 480 -157 612 -64 59 -102 75 -186 75 -83 0 -132 -21 -190 -79 -110 -110 -155 -229 -161 -421 -5 -163 10 -236 70 -358 22 -46 39 -84 37 -85 -6 -4 -281 -108 -299 -113 -44 -13 -182 285 -226 486 -29 133 -27 429 4 570 114 509 471 825 844 745z m2022 -5 c269 -69 490 -326 581 -675 67 -260 58 -563 -25 -805 -47 -136 -154 -324 -180 -316 -19 5 -294 109 -299 113 -2 1 13 35 33 75 182 363 20 873 -279 872 -238 -1 -412 -358 -340 -699 8 -38 15 -75 15 -80 0 -7 -69 3 -175 23 -174 35 -174 35 -184 66 -41 131 -49 506 -13 667 117 537 483 857 866 759z m-859 -2041 c580 -94 1455 -440 1455 -574 0 -122 -307 -300 -712 -414 -724 -204 -1513 -185 -2208 54 -315 108 -540 258 -540 361 0 106 588 366 1140 504 415 103 575 116 865 69z"/>
    </g>
  </defs>

  <!-- the silver bezel, bevelled, and the black rim of the screen -->
  <g filter="url(#drop)">
    <rect x="96" y="96" width="832" height="832" rx="196" fill="url(#silver)"/>
    <rect x="97" y="97" width="830" height="830" rx="195" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="2"/>
  </g>
  <rect x="124" y="124" width="776" height="776" rx="170" fill="url(#bevel)"/>
  <rect x="152" y="152" width="720" height="720" rx="142" fill="url(#rim)"/>

  <!-- the screen -->
  <g clip-path="url(#face)">
    <rect x="184" y="184" width="656" height="656" fill="url(#screen)"/>
    <rect x="184" y="184" width="656" height="656" fill="url(#scan)"/>
    <ellipse cx="512" cy="514" rx="330" ry="300" fill="url(#glow)"/>
    <rect x="184" y="184" width="656" height="270" fill="url(#gloss)"/>
    <rect x="184" y="184" width="656" height="656" rx="112" fill="none" stroke="#000000" stroke-opacity="0.55" stroke-width="30" filter="url(#inner)"/>
    <!-- the glyph, with a glow of its own -->
    <g transform="translate(322.2 299.0) scale(0.40037) translate(-201 -76)">
      <use href="#glyph" fill="#FFB27A" filter="url(#soft)" opacity="0.85"/>
      <use href="#glyph" fill="#FFF6EE"/>
    </g>
  </g>
</svg>
