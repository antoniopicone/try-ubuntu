<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The Dock icon of the QEMU window on macOS (run-qemu.sh's try-ubuntu.app):
       assets/try-ubuntu.icns is this, rendered. The penguin is traced from a
       96x96 PNG (potrace), so it stays sharp at every size; it stands on the
       screen's inner frame, with its face (white) under the traced holes. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop offset="0.00" stop-color="#7B2D74"/><stop offset="1.00" stop-color="#2C001E"/></linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1"><stop offset="0.00" stop-color="#FFFFFF"/><stop offset="1.00" stop-color="#D9D9DE"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0.00" stop-color="#FFB45E"/><stop offset="0.50" stop-color="#E95420"/><stop offset="1.00" stop-color="#772953"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE45E"/><stop offset="1" stop-color="#FF4FB8"/></linearGradient>
    <clipPath id="scr"><rect x="202" y="292" width="620" height="360" rx="44"/></clipPath>
    <filter id="blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="12"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="100" y="104" width="824" height="824" rx="186" fill="#000000" opacity="0.18"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>

  <g filter="url(#shadow)">
    <!-- stand -->
    <path d="M450 678 h124 l16 56 h-156z" fill="#BDBDC4"/>
    <rect x="342" y="726" width="340" height="36" rx="18" fill="url(#frame)"/>
    <!-- the monitor -->
    <rect x="172" y="262" width="680" height="420" rx="74" fill="url(#frame)"/>
    <rect x="199" y="289" width="626" height="366" rx="47" fill="#000000" opacity="0.22"/>
    <g clip-path="url(#scr)">
      <rect x="202" y="292" width="620" height="360" fill="url(#screen)"/>
      <g transform="translate(202 292) scale(1.1397 1.1392) translate(-240 -428)">
    <circle cx="640" cy="606" r="56" fill="#FFE3A8"/>
    <path d="M240 700 L360 590 L440 650 L540 556 L650 664 L784 590 V744 H240Z" fill="#9B3B6B"/>
    <path d="M240 744 V690 L350 640 L470 702 L580 630 L784 722 V744Z" fill="#3A1432"/></g>
      <path d="M202 292 H532 L342 652 H202Z" fill="#FFFFFF" opacity="0.09"/>
      <ellipse cx="512" cy="648" rx="128" ry="13" fill="#000000" opacity="0.25"/>
    </g>
    <!-- the penguin, on the inner frame's bottom edge -->
    <g transform="translate(396.00 428.89) scale(0.45136) translate(-511 -432)">
