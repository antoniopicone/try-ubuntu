      <g transform="translate(0 1200) scale(0.1 -0.1)" fill="#FFF6EE"><path d="M3190 11233 c-539 -57 -1027 -507 -1156 -1068 -30 -126 -29 -7706 0 -7830 120 -514 500 -905 1014 -1042 97 -26 97 -26 1238 -36 627 -5 1157 -7 1177 -3 l37 7 0 369 0 370 -1109 0 c-1098 0 -1110 0 -1177 21 -221 67 -372 217 -443 439 -21 65 -21 65 -19 3800 3 3463 4 3739 20 3790 60 197 222 357 435 431 55 19 105 19 2637 19 1745 0 2602 -4 2645 -11 181 -29 351 -157 440 -328 75 -147 69 30 76 -2046 3 -1028 7 -1870 8 -1871 1 -1 58 -10 127 -18 201 -26 400 -68 581 -123 25 -7 32 901 21 2612 -9 1371 -10 1391 -31 1473 -130 511 -504 885 -1024 1024 -82 23 -82 23 -2772 24 -1479 0 -2706 -1 -2725 -3z"/>
