<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6844F"/>
      <stop offset="1" stop-color="#E95420"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C7421A"/>
      <stop offset="1" stop-color="#A9370F"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E2750"/>
      <stop offset="0.6" stop-color="#A8386B"/>
      <stop offset="1" stop-color="#F6A56B"/>
    </linearGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E3168"/>
      <stop offset="1" stop-color="#6B2659"/>
    </linearGradient>
    <linearGradient id="near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A1E45"/>
      <stop offset="1" stop-color="#2C1230"/>
    </linearGradient>
    <clipPath id="picture">
      <rect x="50" y="62" width="156" height="110" rx="14"/>
    </clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dy="4"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tile" x="-10%" y="-10%" width="120%" height="125%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base tile (Yaru rounded square with bottom edge) -->
  <g filter="url(#tile)">
    <rect x="20" y="24" width="216" height="212" rx="44" fill="url(#edge)"/>
    <rect x="20" y="20" width="216" height="208" rx="44" fill="url(#bg)"/>
    <rect x="21" y="21" width="214" height="206" rx="43" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- The screen: a white frame around the wallpaper, on its stand -->
  <g filter="url(#soft)">
    <rect x="42" y="54" width="172" height="126" rx="20" fill="#FFFFFF"/>
    <path d="M112 180h32l6 20h-44z" fill="#EDEDED"/>
    <rect x="92" y="198" width="72" height="10" rx="5" fill="#FFFFFF"/>
  </g>

  <!-- The wallpaper: sun, two ranges of mountains -->
  <g clip-path="url(#picture)">
    <rect x="50" y="62" width="156" height="110" fill="url(#sky)"/>
    <circle cx="158" cy="110" r="17" fill="#FFE1A8"/>
    <path d="M50 150l34-40 26 28 22-24 34 36 40-30v52H50z" fill="url(#far)"/>
    <path d="M50 172v-18l30-22 28 26 30-34 68 48z" fill="url(#near)"/>
  </g>
</svg>
