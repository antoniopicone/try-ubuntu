# On a version tag (v*), builds the live ISOs (QEMU flavour) on native arm64
# and x86 runners and
# QEMU for Apple Silicon (qemu/build.sh) on a macOS one, and publishes them,
# with their SHA256SUMS, as a GitHub release. install.sh downloads from the
# latest release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  iso:
    name: ISO (${{ matrix.arch }})
    strategy:
      # One architecture failing doesn't cancel the other's build (hours, and
      # its GNOME cache)
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            build_arch: arm
            runner: ubuntu-24.04-arm
            cache_volume: try-ubuntu-gnome50-cache
          - arch: amd64
            build_arch: x86
            runner: ubuntu-24.04
            cache_volume: try-ubuntu-gnome50-cache-amd64
    runs-on: ${{ matrix.runner }}
    # Rebuilding the GNOME packages with local fixes takes a while when the
    # cache below misses.
    timeout-minutes: 360
    env:
      ISO: ubuntu-live-${{ matrix.arch }}.iso
      # build.sh's, per architecture
      CACHE_VOLUME: ${{ matrix.cache_volume }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache
          df -h /

      - name: Install podman
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq podman

      # The rebuilt GNOME .debs (build-gnome.sh skips a package whose build is
      # already in the repository: same source version, same local patches).
      # GNOME 50's own caches (gnome50-repo-*), not GNOME 51's (branch main).
      # The latest cache with the same patches and builder image comes first,
      # else the latest one at all: the stamps already rebuild a package whose
      # 26.04 version or local patches changed, and build-gnome.sh builds the
      # packages it adds. To start over (a new builder image, other build
      # flags), delete the gnome50-repo-* caches in Actions.
      - name: Restore the rebuilt GNOME packages
        id: gnome-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/gnome-repo
          key: gnome50-repo-${{ matrix.arch }}-${{ hashFiles('patches/gnome/**', 'Containerfile') }}-${{ github.run_id }}
          restore-keys: |
            gnome50-repo-${{ matrix.arch }}-${{ hashFiles('patches/gnome/**', 'Containerfile') }}-
            gnome50-repo-${{ matrix.arch }}-

      - name: Seed the build cache
        if: steps.gnome-cache.outputs.cache-matched-key != ''
        run: |
          sudo podman volume create "$CACHE_VOLUME" >/dev/null
          mp=$(sudo podman volume inspect --format '{{.Mountpoint}}' "$CACHE_VOLUME")
          sudo cp -a "$RUNNER_TEMP/gnome-repo" "$mp/"

      # Rootful podman: the ISO step needs loop devices.
      - name: Build
        run: sudo ./build.sh --xkb us --arch ${{ matrix.build_arch }}

      - name: Collect the rebuilt GNOME packages
        id: gnome-collect
        if: ${{ !cancelled() }}
        run: |
          mp=$(sudo podman volume inspect --format '{{.Mountpoint}}' "$CACHE_VOLUME" 2>/dev/null) || exit 0
          sudo test -d "$mp/gnome-repo" || exit 0
          rm -rf "$RUNNER_TEMP/gnome-repo"
          sudo cp -a "$mp/gnome-repo" "$RUNNER_TEMP/"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/gnome-repo"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Save the rebuilt GNOME packages
        if: ${{ !cancelled() && steps.gnome-collect.outputs.ok == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/gnome-repo
          key: gnome50-repo-${{ matrix.arch }}-${{ hashFiles('patches/gnome/**', 'Containerfile') }}-${{ github.run_id }}

      - name: Checksum
        run: |
          sudo chown -R "$(id -u):$(id -g)" dist
          cd dist
          size=$(stat -c %s "$ISO")
          echo "$ISO: $((size / 1024 / 1024)) MiB"
          # GitHub's limit for a release asset.
          ((size < 2 * 1024 * 1024 * 1024)) || { echo "$ISO is over 2 GiB" >&2; exit 1; }
          sha256sum "$ISO" > "$ISO.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: iso-${{ matrix.arch }}
          path: |
            dist/${{ env.ISO }}
            dist/${{ env.ISO }}.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  qemu:
    name: QEMU (macOS arm64)
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # The pinned downloads; build.sh checks each one's sha256 anyway.
      - uses: actions/cache@v4
        with:
          path: dist/.cache/qemu
          key: qemu-archives-${{ hashFiles('qemu/build.sh') }}
          restore-keys: qemu-archives-

      - name: Build
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          ./qemu/build.sh

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 qemu-macos-arm64.tar.gz > qemu-macos-arm64.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-macos-arm64
          path: |
            dist/qemu-macos-arm64.tar.gz
            dist/qemu-macos-arm64.tar.gz.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [iso, qemu]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: SHA256SUMS
        run: |
          cd dist
          cat ./*.sha256 > SHA256SUMS
          rm ./*.sha256
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.iso
            dist/qemu-macos-arm64.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
